<script>/* ---------------------------------------------------------------------------
   Micro-runtime de plantillas — sustituye a dc-runtime.
   Sin React, sin Babel, sin CDN: ~5 KB y todo local.

   Interpreta el mismo lenguaje de plantilla que usa Claude Design:
     {{ expresion }}            en texto y dentro de atributos
     <sc-if value="{{ x }}">    condicional
     <sc-for list="{{ l }}" as="p">  repeticion
     onClick / onChange="{{ h }}"    manejadores
     style-hover="..."               estilos al pasar el raton

   La plantilla llega ya compilada a arbol de instrucciones (JSON) desde
   construir_app.py, asi que aqui no se parsea HTML: los nodos se crean con
   createElement, lo que evita que el parser del navegador reubique un
   <sc-for> que este dentro de una <table>.

   El render construye un arbol nuevo y despues lo fusiona (morphing) contra
   el vivo, emparejando por clave. Asi no se pierde el foco del buscador ni
   la posicion del scroll al teclear.
--------------------------------------------------------------------------- */
(function (global) {
  'use strict';

  var VACIOS = { input: 1, br: 1, img: 1, hr: 1, meta: 1, link: 1, source: 1 };

  // ---- evaluacion de expresiones (solo rutas y literales) ----
  function evaluar(scope, expr) {
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (expr === 'null') return null;
    var partes = expr.split('.');
    var v = scope[partes[0]];
    for (var i = 1; i < partes.length && v !== null && v !== undefined; i++) v = v[partes[i]];
    return v;
  }

  // Une los trozos de un atributo o de un texto: ["px ", {e:"x"}, ";"]
  function unir(partes, scope) {
    if (partes.length === 1 && typeof partes[0] === 'object') {
      var u = evaluar(scope, partes[0].e);
      return u === null || u === undefined ? '' : u;
    }
    var s = '';
    for (var i = 0; i < partes.length; i++) {
      var p = partes[i];
      if (typeof p === 'string') s += p;
      else {
        var v = evaluar(scope, p.e);
        s += (v === null || v === undefined) ? '' : v;
      }
    }
    return s;
  }

  // ---- construccion del arbol nuevo ----
  function construir(inst, scope, salida, clave) {
    for (var i = 0; i < inst.length; i++) {
      var n = inst[i];
      var k = clave + '/' + i;

      if (n.t === 'tx') {
        var txt = String(unir(n.p, scope));
        var nodo = document.createTextNode(txt);
        nodo.__k = k;
        salida.push(nodo);

      } else if (n.t === 'if') {
        if (evaluar(scope, n.e)) construir(n.k, scope, salida, k + ':si');

      } else if (n.t === 'for') {
        var lista = evaluar(scope, n.e);
        if (lista && lista.length) {
          for (var j = 0; j < lista.length; j++) {
            var hijo = Object.create(scope);
            hijo[n.as] = lista[j];
            // la clave usa el id del elemento si lo tiene: asi reordenar no recrea
            var idj = (lista[j] && (lista[j].id || lista[j].key || lista[j].valor || lista[j].label));
            construir(n.k, hijo, salida, k + '#' + (idj !== undefined ? idj : j));
          }
        }

      } else if (n.t === 'el') {
        var el = document.createElement(n.g);
        el.__k = k;
        for (var a in n.a) el.setAttribute(a, unir(n.a[a], scope));
        if (n.v !== undefined) {
          var val = unir(n.v, scope);
          if (el.value !== val) el.value = val;
        }
        if (n.ev) {
          el.__on = {};
          for (var ev in n.ev) {
            var h = evaluar(scope, n.ev[ev]);
            if (typeof h === 'function') el.__on[ev] = h;
          }
        }
        if (n.k && n.k.length) {
          var hijos = [];
          construir(n.k, scope, hijos, k);
          for (var m = 0; m < hijos.length; m++) el.appendChild(hijos[m]);
        }
        salida.push(el);
      }
    }
  }

  // ---- fusion contra el DOM vivo ----
  function sincronizarAtributos(viejo, nuevo) {
    var na = nuevo.attributes, i, at;
    for (i = 0; i < na.length; i++) {
      at = na[i];
      if (viejo.getAttribute(at.name) !== at.value) viejo.setAttribute(at.name, at.value);
    }
    var va = viejo.attributes;
    for (i = va.length - 1; i >= 0; i--) {
      at = va[i];
      if (!nuevo.hasAttribute(at.name)) viejo.removeAttribute(at.name);
    }
    if ('value' in nuevo && nuevo.tagName === 'INPUT') {
      if (viejo.value !== nuevo.value) viejo.value = nuevo.value;
    }
  }

  function fusionar(viejo, nuevo) {
    if (nuevo.nodeType === 3) {
      if (viejo.nodeValue !== nuevo.nodeValue) viejo.nodeValue = nuevo.nodeValue;
      return viejo;
    }
    sincronizarAtributos(viejo, nuevo);
    viejo.__on = nuevo.__on;
    fusionarHijos(viejo, nuevo.childNodes);
    return viejo;
  }

  function fusionarHijos(padre, nuevos) {
    var viejos = [], i;
    for (i = 0; i < padre.childNodes.length; i++) viejos.push(padre.childNodes[i]);

    var porClave = {};
    for (i = 0; i < viejos.length; i++) {
      if (viejos[i].__k !== undefined) porClave[viejos[i].__k] = viejos[i];
    }

    var resultado = [], usados = [];
    for (i = 0; i < nuevos.length; i++) {
      var n = nuevos[i];
      var v = porClave[n.__k];
      if (v && v.nodeName === n.nodeName && !v.__usado) {
        v.__usado = true;
        usados.push(v);
        resultado.push(fusionar(v, n));
      } else {
        resultado.push(n);
      }
    }
    for (i = 0; i < usados.length; i++) usados[i].__usado = false;

    // fuera los que ya no estan
    var vivos = {};
    for (i = 0; i < resultado.length; i++) vivos[i] = resultado[i];
    for (i = 0; i < viejos.length; i++) {
      var q = viejos[i], sigue = false;
      for (var j = 0; j < resultado.length; j++) if (resultado[j] === q) { sigue = true; break; }
      if (!sigue && q.parentNode === padre) padre.removeChild(q);
    }

    // coloca en orden (insertBefore mueve si ya estaba)
    var ref = null;
    for (i = resultado.length - 1; i >= 0; i--) {
      var nodo = resultado[i];
      if (nodo.parentNode !== padre || nodo.nextSibling !== ref) padre.insertBefore(nodo, ref);
      ref = nodo;
    }
  }

  // ---- delegacion de eventos ----
  function delegar(raiz, tipo) {
    raiz.addEventListener(tipo, function (e) {
      var n = e.target;
      while (n && n !== raiz.parentNode) {
        if (n.__on && n.__on[tipo]) {
          n.__on[tipo](e);
          if (e.cancelBubble) return;   // el manejador llamo a stopPropagation()
        }
        n = n.parentNode;
      }
    }, false);
  }

  // ---- clase base ----
  function Logic(raiz, inst, props) {
    this.base = raiz;
    this._inst = inst;
    this.props = props || {};
    this._pendiente = false;
    if (!this.state) this.state = {};
  }

  Logic.prototype.setState = function (o) {
    for (var k in o) this.state[k] = o[k];
    this.programar();
  };

  // Se repinta en una microtarea, no en requestAnimationFrame: rAF se congela
  // cuando la pestana no esta en primer plano y la app se quedaria muerta.
  var aplazar = (typeof queueMicrotask === 'function')
    ? queueMicrotask
    : function (f) { Promise.resolve().then(f); };

  Logic.prototype.programar = function () {
    if (this._pendiente) return;
    this._pendiente = true;
    var self = this;
    aplazar(function () {
      self._pendiente = false;
      try { self.pintar(); } catch (e) { console.error('Error al pintar:', e); }
    });
  };

  Logic.prototype.pintar = function () {
    var scope = this.renderVals();
    var hijos = [];
    construir(this._inst, scope, hijos, '');
    var contenedor = document.createDocumentFragment();
    for (var i = 0; i < hijos.length; i++) contenedor.appendChild(hijos[i]);
    fusionarHijos(this.base, contenedor.childNodes);
    if (this.componentDidUpdate) this.componentDidUpdate();
  };

  Logic.prototype.montar = function () {
    delegar(this.base, 'click');
    delegar(this.base, 'input');
    this.pintar();
    if (this.componentDidMount) this.componentDidMount();
    this.programar();
  };

  global.Logic = Logic;
  global.DCRuntime = { evaluar: evaluar, construir: construir, fusionar: fusionar };

})(typeof window !== 'undefined' ? window : this);
</script>

pacing:.05em;text-transform:uppercase;color:var(--fg3)"]},"k":[{"t":"tx","p":[{"e":"c.label"}]}]},{"t":"el","g":"div","a":{"style":["font:400 ",{"e":"c.tam"},"/1.6 ",{"e":"c.fuente"},";font-variant-numeric:tabular-nums;color:",{"e":"c.color"},";margin-top:3px;overflow-wrap:anywhere;text-wrap:pretty"]},"k":[{"t":"tx","p":[{"e":"c.valor"}]}]}]}]}]}]}]}]}]},{"t":"el","g":"div","a":{"style":["display:flex;gap:7px;margin-top:12px"]},"k":[{"t":"el","g":"button","a":{"style":["flex:1;height:46px;border:1px solid ",{"e":"ficha.cmpBorde"},";border-radius:9px;background:",{"e":"ficha.cmpFondo"},";color:",{"e":"ficha.cmpColor"},";font:500 12.5px 'IBM Plex Sans',sans-serif;cursor:pointer"]},"k":[{"t":"tx","p":[{"e":"ficha.cmpTxt"}]}],"ev":{"click":"ficha.onComparar"}},{"t":"el","g":"button","a":{"style":["flex:1;height:46px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--fg2);font:500 12.5px 'IBM Plex Sans',sans-serif;cursor:pointer"]},"k":[{"t":"tx","p":["Volver a la lista"]}],"ev":{"click":"onCerrarFicha"}}]},{"t":"el","g":"div","a":{"style":["font:400 10.5px/1.6 'JetBrains Mono',monospace;color:var(--fg3);margin-top:12px"]},"k":[{"t":"tx","p":["Leido en la documentacion oficial el ",{"e":"fechaConsultaTxt"},". Verificalo en la web de la firma antes de pagar."]}]}]}]}]}]}];</script>
<script>

class Component extends Logic {
  state = {
    listo: false, q: '', vista: 'lista', hoja: null, tema: 'oscuro',
    enums: {}, rangos: {}, ordenKey: 'puesto', ordenDir: 'asc',
    cols: ['precio_tarifa', 'drawdown', 'dias_min'],
    favs: [], soloFavs: false, meses: 2, comparar: [], ficha: null,
    abiertos: { Identidad: true, Precio: true, Reglas: true, Cobros: false, Plataforma: false, Fiabilidad: false },
    soloDif: true, ancho: false
  };

  CLAVE = 'ff.comparador.v1';
  DERIVADOS = [
    { key: '_coste_tarifa', label: 'Coste real a tarifa', tipo: 'numero', unidad: 'USD', grupo: 'Coste real (simulador)', ordenable: true },
    { key: '_coste_promo', label: 'Coste real con promo', tipo: 'numero', unidad: 'USD', grupo: 'Coste real (simulador)', ordenable: true },
    { key: '_ahorro', label: 'Ahorro de la promo', tipo: 'numero', unidad: 'USD', grupo: 'Coste real (simulador)', ordenable: true }
  ];

  componentDidMount() {
    const ti = this.props.temaInicial;
    if (ti === 'claro' || ti === 'oscuro') {
      document.documentElement.setAttribute('data-tema', ti);
      this.setState({ tema: ti });
    }
    if (this.num(this.props.mesesInicial)) this.setState({ meses: this.props.mesesInicial });
    this.restaurar();
    this.esperarDatos();
    this.medir();
    window.addEventListener('resize', this.medir);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.medir);
    clearTimeout(this._t);
  }
  componentDidUpdate() { this.guardar(); }

  esperarDatos = () => {
    if (window.DATA && window.DATA.campos) { this.setState({ listo: true }); return; }
    this._t = setTimeout(this.esperarDatos, 60);
  };
  medir = () => {
    const w = (this.base && this.base.offsetWidth) || window.innerWidth || 390;
    const ancho = /movil/.test(location.hash) ? false : w >= 780;
    if (ancho !== this.state.ancho) this.setState({ ancho });
  };

  restaurar() {
    try {
      const raw = localStorage.getItem(this.CLAVE);
      if (!raw) return;
      const s = JSON.parse(raw);
      const ok = {};
      ['enums', 'rangos', 'ordenKey', 'ordenDir', 'cols', 'favs', 'soloFavs', 'meses', 'tema', 'vista', 'abiertos', 'soloDif'].forEach(k => {
        if (s[k] !== undefined && s[k] !== null) ok[k] = s[k];
      });
      if (ok.tema) document.documentElement.setAttribute('data-tema', ok.tema === 'claro' ? 'claro' : 'oscuro');
      this.setState(ok);
    } catch (e) { /* almacenamiento no disponible */ }
  }
  guardar() {
    try {
      const s = this.state;
      localStorage.setItem(this.CLAVE, JSON.stringify({
        enums: s.enums, rangos: s.rangos, ordenKey: s.ordenKey, ordenDir: s.ordenDir,
        cols: s.cols, favs: s.favs, soloFavs: s.soloFavs, meses: s.meses, tema: s.tema,
        vista: s.vista, abiertos: s.abiertos, soloDif: s.soloDif
      }));
    } catch (e) { /* almacenamiento no disponible */ }
  }

  // ---------- datos ----------
  D() { return window.DATA || { meta: {}, campos: [], planes: [] }; }
  campo(key) { return this.D().campos.find(c => c.key === key) || this.DERIVADOS.find(c => c.key === key) || { key, label: key, tipo: 'texto' }; }

  num(v) { return typeof v === 'number' && isFinite(v); }
  miles(v) { return new Intl.NumberFormat('es-ES', { maximumFractionDigits: 2 }).format(v); }
  fmt(v, c) {
    if (v === null || v === undefined || v === '') return '—';
    if (c.tipo === 'numero' && this.num(v)) {
      if (c.unidad === 'USD') return this.miles(v) + ' USD';
      if (c.unidad === '%') return this.miles(v) + ' %';
      if (c.unidad === 'dias') return v === 1 ? '1 dia' : this.miles(v) + ' dias';
      return this.miles(v);
    }
    if (c.tipo === 'fecha') return this.fecha(v);
    return String(v);
  }
  fmtCorto(v, c) {
    if (v === null || v === undefined || v === '') return '—';
    if (c.tipo === 'numero' && this.num(v)) {
      if (c.unidad === 'USD') return this.miles(v) + ' $';
      if (c.unidad === '%') return this.miles(v) + '%';
      if (c.unidad === 'dias') return this.miles(v) + ' d';
      return this.miles(v);
    }
    return String(v);
  }
  fecha(s) {
    const m = /(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
    return m ? m[3] + '/' + m[2] + '/' + m[1] : String(s || '—');
  }
  mensual(p) { return String(p.tipo_precio || '') === 'mensual'; }
  costeTarifa(p, m) { return (p.precio_tarifa || 0) * (this.mensual(p) ? m : 1) + (p.activacion || 0); }
  costePromo(p, m) {
    const base = this.num(p.precio_promo) ? p.precio_promo : (p.precio_tarifa || 0);
    return base * (this.mensual(p) ? m : 1) + (p.activacion || 0);
  }
  diasPromo(p) {
    const m = /(\d{4})-(\d{2})-(\d{2})/.exec(String(p.promo_caduca || ''));
    if (!m) return null;
    const fin = new Date(+m[1], +m[2] - 1, +m[3], 23, 59, 59);
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    return Math.round((fin - hoy) / 86400000);
  }
  tvOk(p) { return /^si/i.test(String(p.tradingview || '')); }
  excluido(p) { return /DESCARTADA/i.test(String(p.estado || '')); }
  penalizado(p) { return /penalizada/i.test(String(p.estado || '')); }
  referencia(p) { return /^REFERENCIA/i.test(String(p.firma || '')); }

  valorEnum(p, key) {
    const v = p[key];
    return (v === null || v === undefined || v === '') ? '(sin dato)' : String(v);
  }
  extremos(key) {
    const vs = this.D().planes.map(p => p[key]).filter(v => this.num(v));
    if (!vs.length) return { min: 0, max: 1 };
    let min = Math.floor(Math.min.apply(null, vs)), max = Math.ceil(Math.max.apply(null, vs));
    if (min === max) max = min + 1;
    return { min, max };
  }
  rangoActivo(key) {
    const r = this.state.rangos[key];
    if (!r) return null;
    const e = this.extremos(key);
    if (r[0] <= e.min && r[1] >= e.max) return null;
    return r;
  }

  pasa(p, omitir) {
    const s = this.state;
    const q = s.q.trim().toLowerCase();
    if (q && !((String(p.firma) + ' ' + String(p.plan)).toLowerCase().includes(q))) return false;
    if (s.soloFavs && s.favs.indexOf(p.id) < 0) return false;
    for (const key in s.enums) {
      if (key === omitir) continue;
      const sel = s.enums[key];
      if (sel && sel.length && sel.indexOf(this.valorEnum(p, key)) < 0) return false;
    }
    for (const key in s.rangos) {
      if (key === omitir) continue;
      const r = this.rangoActivo(key);
      if (!r) continue;
      const v = p[key];
      if (!this.num(v)) return false;
      if (v < r[0] || v > r[1]) return false;
    }
    return true;
  }
  filtrados(omitir) { return this.D().planes.filter(p => this.pasa(p, omitir)); }

  ordenar(lista) {
    const s = this.state, key = s.ordenKey, dir = s.ordenDir === 'desc' ? -1 : 1;
    const c = this.campo(key);
    const val = p => {
      if (key === '_coste_tarifa') return this.costeTarifa(p, s.meses);
      if (key === '_coste_promo') return this.costePromo(p, s.meses);
      if (key === '_ahorro') return this.costeTarifa(p, s.meses) - this.costePromo(p, s.meses);
      return p[key];
    };
    return lista.slice().sort((a, b) => {
      const va = val(a), vb = val(b);
      const na = va === null || va === undefined || va === '', nb = vb === null || vb === undefined || vb === '';
      if (na && nb) return 0;
      if (na) return 1;
      if (nb) return -1;
      if (c.tipo === 'numero' && this.num(va) && this.num(vb)) return (va - vb) * dir;
      return String(va).localeCompare(String(vb), 'es') * dir;
    });
  }
  visibles() {
    const l = this.filtrados();
    if (this.state.vista === 'coste') {
      const m = this.state.meses;
      const v = p => (!this.num(p.precio_tarifa) && !this.num(p.precio_promo)) ? Infinity : this.costePromo(p, m);
      return l.slice().sort((a, b) => v(a) - v(b));
    }
    return this.ordenar(l);
  }
  nFiltros() {
    const s = this.state; let n = 0;
    for (const k in s.enums) if (s.enums[k] && s.enums[k].length) n++;
    for (const k in s.rangos) if (this.rangoActivo(k)) n++;
    if (s.soloFavs) n++;
    if (s.q.trim()) n++;
    return n;
  }

  // ---------- acciones ----------
  set = (o) => this.setState(o);
  onQ = e => this.setState({ q: e.target.value });
  onQClear = () => this.setState({ q: '' });
  onTema = () => {
    const t = this.state.tema === 'claro' ? 'oscuro' : 'claro';
    document.documentElement.setAttribute('data-tema', t);
    this.setState({ tema: t });
  };
  onFavsToggle = () => this.setState({ soloFavs: !this.state.soloFavs });
  onLimpiar = () => this.setState({ enums: {}, rangos: {}, q: '', soloFavs: false });
  toggleEnum(key, valor) {
    const cur = (this.state.enums[key] || []).slice();
    const i = cur.indexOf(valor);
    if (i < 0) cur.push(valor); else cur.splice(i, 1);
    const enums = Object.assign({}, this.state.enums);
    if (cur.length) enums[key] = cur; else delete enums[key];
    this.setState({ enums });
  }
  setRango(key, i, v) {
    const e = this.extremos(key);
    const cur = (this.state.rangos[key] || [e.min, e.max]).slice();
    cur[i] = +v;
    if (cur[0] > cur[1]) cur[i === 0 ? 1 : 0] = cur[i];
    this.setState({ rangos: Object.assign({}, this.state.rangos, { [key]: cur }) });
  }
  toggleFav(id) {
    const favs = this.state.favs.slice();
    const i = favs.indexOf(id);
    if (i < 0) favs.push(id); else favs.splice(i, 1);
    this.setState({ favs });
  }
  toggleComparar(id) {
    const c = this.state.comparar.slice();
    const i = c.indexOf(id);
    if (i >= 0) c.splice(i, 1);
    else { if (c.length >= 3) c.shift(); c.push(id); }
    this.setState({ comparar: c });
  }
  toggleCol(key) {
    const cols = this.state.cols.slice();
    const i = cols.indexOf(key);
    if (i >= 0) { if (cols.length > 1) cols.splice(i, 1); }
    else { if (cols.length >= 3) cols.shift(); cols.push(key); }
    this.setState({ cols });
  }
  ordenarPor(key) {
    if (this.state.ordenKey === key) this.setState({ ordenDir: this.state.ordenDir === 'asc' ? 'desc' : 'asc' });
    else this.setState({ ordenKey: key, ordenDir: 'asc' });
  }
  csv = () => {
    const campos = this.D().campos;
    const filas = this.visibles();
    const esc = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
    const m = this.state.meses;
    const cab = campos.map(c => c.label).concat(['Coste real a tarifa (' + m + 'm)', 'Coste real con promo (' + m + 'm)', 'Ahorro']);
    const cuerpo = filas.map(p => campos.map(c => esc(p[c.key])).concat([
      esc(this.costeTarifa(p, m)), esc(this.costePromo(p, m)), esc(this.costeTarifa(p, m) - this.costePromo(p, m))
    ]).join(';'));
    const txt = '\ufeff' + cab.map(esc).join(';') + '\n' + cuerpo.join('\n');
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
      a.download = 'fondeadoras_seleccion.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    } catch (e) { /* descarga no disponible */ }
  };

  // ---------- presentacion ----------
  badges(p) {
    const b = [];
    const d = this.diasPromo(p);
    const umbral = this.num(this.props.avisoPromoDias) ? this.props.avisoPromoDias : 7;
    if (d !== null) {
      const col = d <= 0 ? 'var(--bad)' : (d < umbral ? 'var(--warn)' : 'var(--fg2)');
      const bg = d <= 0 ? 'var(--badbg)' : (d < umbral ? 'var(--warnbg)' : 'transparent');
      b.push({
        txt: d < 0 ? 'PROMO CADUCADA' : (d === 0 ? 'LA PROMO CADUCA HOY' : 'PROMO: ' + d + (d === 1 ? ' DIA' : ' DIAS')),
        color: col, fondo: bg, borde: col, title: String(p.promo_caduca || '')
      });
    }
    if (p.cupon) b.push({ txt: 'CUPON ' + String(p.cupon).split(' ')[0], color: 'var(--fg)', fondo: 'var(--chip)', borde: 'var(--line2)', title: String(p.cupon) });
    if (this.tvOk(p)) b.push({ txt: 'TRADINGVIEW', color: 'var(--ok)', fondo: 'var(--okbg)', borde: 'var(--ok)', title: String(p.tradingview) });
    if (this.excluido(p)) b.push({ txt: 'EXCLUIDA DEL RANKING', color: 'var(--bad)', fondo: 'var(--badbg)', borde: 'var(--bad)', title: String(p.estado) });
    else if (this.penalizado(p)) b.push({ txt: 'PENALIZADA −12', color: 'var(--warn)', fondo: 'var(--warnbg)', borde: 'var(--warn)', title: String(p.estado) });
    if (this.referencia(p)) b.push({ txt: 'FILA DE REFERENCIA', color: 'var(--fg2)', fondo: 'var(--chip)', borde: 'var(--line2)', title: String(p.estado) });
    return b;
  }
  precioTxt(p) {
    const v = this.num(p.precio_promo) ? p.precio_promo : p.precio_tarifa;
    if (!this.num(v)) return 's/precio';
    return this.miles(v) + ' $';
  }
  puestoTxt(p) { return this.num(p.puesto) ? '#' + p.puesto : String(p.puesto || '—'); }

  renderVals() {
    const s = this.state, D = this.D(), meta = D.meta || {};
    if (!s.listo) {
      return {
        meta: { titulo: 'Comparador de fondeadoras' }, cabeceraSub: 'Cargando datos…',
        tarjetas: [], filas: [], tabs: [], facetas: [], rangos: [], metodo: [], costes: [],
        esLista: true, esEstrecho: true, recuento: '—',
        temaIcono: 'NOC', filtrosSufijo: '', ordenEtiqueta: 'Orden: Puesto ↑', ordenResumen: ''
      };
    }
    const vis = this.visibles();
    const nF = this.nFiltros();
    const acc = 'var(--acc)', fg = 'var(--fg)', fg2 = 'var(--fg2)', fg3 = 'var(--fg3)', linea = 'var(--line)', panel2 = 'var(--panel2)';
    const mono = "'JetBrains Mono',monospace", sans = "'IBM Plex Sans',sans-serif";

    // tarjetas
    const colCampos = s.cols.map(k => this.campo(k));
    const tarjetas = vis.map(p => ({
      id: p.id, firma: p.firma, plan: p.plan, puestoTxt: this.puestoTxt(p),
      precioTxt: this.precioTxt(p),
      tarifaTxt: this.num(p.precio_tarifa) ? this.miles(p.precio_tarifa) + ' $' : '',
      hayDescuento: this.num(p.precio_promo) && this.num(p.precio_tarifa) && p.precio_promo < p.precio_tarifa,
      tipoTxt: (p.tipo_precio ? String(p.tipo_precio).toUpperCase() : 'S/TIPO') + (p.activacion ? ' + ' + this.miles(p.activacion) + ' $ ACTIVACION' : ''),
      borde: this.excluido(p) ? 'var(--bad)' : (s.comparar.indexOf(p.id) >= 0 ? acc : linea),
      favColor: s.favs.indexOf(p.id) >= 0 ? 'var(--warn)' : fg3,
      badges: this.badges(p),
      metricas: colCampos.map(c => ({ label: c.label, valor: this.fmt(p[c.key], c) })),
      cmpTxt: s.comparar.indexOf(p.id) >= 0 ? 'En el comparador' : 'Comparar',
      cmpFondo: s.comparar.indexOf(p.id) >= 0 ? 'var(--accbg)' : panel2,
      cmpColor: s.comparar.indexOf(p.id) >= 0 ? acc : fg2,
      onFav: e => { e.stopPropagation(); this.toggleFav(p.id); },
      onComparar: e => { e.stopPropagation(); this.toggleComparar(p.id); },
      onAbrir: () => this.setState({ ficha: p.id })
    }));

    // tabla ancha
    const cabCampos = [this.campo('puesto'), this.campo('firma'), this.campo('plan'), this.campo('precio_promo')].concat(colCampos);
    const tablaCabeceras = cabCampos.map(c => ({
      label: c.label + (s.ordenKey === c.key ? (s.ordenDir === 'asc' ? ' ↑' : ' ↓') : ''),
      align: c.tipo === 'numero' ? 'right' : 'left',
      color: s.ordenKey === c.key ? acc : fg3,
      onSort: e => { e.stopPropagation(); this.ordenarPor(c.key); }
    }));
    const filas = vis.map(p => ({
      id: p.id,
      fondo: s.comparar.indexOf(p.id) >= 0 ? 'var(--accbg)' : 'transparent',
      favColor: s.favs.indexOf(p.id) >= 0 ? 'var(--warn)' : fg3,
      onFav: e => { e.stopPropagation(); this.toggleFav(p.id); },
      onAbrir: () => this.setState({ ficha: p.id }),
      celdas: cabCampos.map(c => ({
        txt: c.key === 'puesto' ? this.puestoTxt(p) : this.fmtCorto(p[c.key], c),
        align: c.tipo === 'numero' ? 'right' : 'left',
        fuente: c.tipo === 'numero' ? mono : sans,
        color: c.key === 'firma' ? acc : (c.key === 'plan' ? fg : fg2)
      }))
    }));

    // facetas
    const facetas = D.campos.filter(c => c.filtrable && (c.tipo === 'enum' || c.tipo === 'texto' || c.tipo === 'booleano')).map(c => {
      const base = this.filtrados(c.key);
      const todos = {};
      D.planes.forEach(p => { const v = this.valorEnum(p, c.key); todos[v] = (todos[v] || 0); });
      base.forEach(p => { const v = this.valorEnum(p, c.key); todos[v] = (todos[v] || 0) + 1; });
      const sel = s.enums[c.key] || [];
      const valores = Object.keys(todos).sort((a, b) => todos[b] - todos[a] || a.localeCompare(b, 'es')).map(v => {
        const activo = sel.indexOf(v) >= 0;
        return {
          valor: v, etiqueta: v, n: todos[v], tick: activo ? '×' : '',
          activo, borde: activo ? acc : linea, fondo: activo ? 'var(--accbg)' : 'transparent',
          marcaBorde: activo ? acc : 'var(--line2)', marcaFondo: activo ? acc : 'transparent',
          color: todos[v] === 0 && !activo ? fg3 : fg,
          nColor: todos[v] === 0 ? fg3 : fg2,
          onToggle: () => this.toggleEnum(c.key, v)
        };
      });
      return { key: c.key, label: c.label, grupo: c.grupo, valores };
    });

    // rangos
    const rangos = D.campos.filter(c => c.filtrable && c.tipo === 'numero').map(c => {
      const e = this.extremos(c.key);
      const r = s.rangos[c.key] || [e.min, e.max];
      const activo = !!this.rangoActivo(c.key);
      const step = (e.max - e.min) > 600 ? 10 : ((e.max - e.min) > 60 ? 1 : 1);
      return {
        key: c.key, label: c.label, min: e.min, max: e.max, step, lo: r[0], hi: r[1],
        resumen: this.fmtCorto(r[0], c) + ' – ' + this.fmtCorto(r[1], c),
        color: activo ? acc : fg3,
        n: this.filtrados().length,
        onLo: ev => this.setRango(c.key, 0, ev.target.value),
        onHi: ev => this.setRango(c.key, 1, ev.target.value)
      };
    });

    // orden
    const ordenables = D.campos.filter(c => c.ordenable).concat(this.DERIVADOS);
    const grupos = [];
    ordenables.forEach(c => {
      let g = grupos.find(x => x.grupo === c.grupo);
      if (!g) { g = { grupo: c.grupo, campos: [] }; grupos.push(g); }
      g.campos.push({
        label: c.label, borde: s.ordenKey === c.key ? acc : linea,
        fondo: s.ordenKey === c.key ? 'var(--accbg)' : panel2,
        color: s.ordenKey === c.key ? acc : fg2,
        onClick: () => this.ordenarPor(c.key)
      });
    });
    const dirs = [
      { label: 'Ascendente', borde: s.ordenDir === 'asc' ? acc : linea, fondo: s.ordenDir === 'asc' ? 'var(--accbg)' : panel2, color: s.ordenDir === 'asc' ? acc : fg2, onClick: () => this.setState({ ordenDir: 'asc' }) },
      { label: 'Descendente', borde: s.ordenDir === 'desc' ? acc : linea, fondo: s.ordenDir === 'desc' ? 'var(--accbg)' : panel2, color: s.ordenDir === 'desc' ? acc : fg2, onClick: () => this.setState({ ordenDir: 'desc' }) }
    ];

    // columnas
    const colGrupos = [];
    D.campos.filter(c => c.key !== 'firma' && c.key !== 'plan').forEach(c => {
      let g = colGrupos.find(x => x.grupo === c.grupo);
      if (!g) { g = { grupo: c.grupo, campos: [] }; colGrupos.push(g); }
      const i = s.cols.indexOf(c.key);
      g.campos.push({
        label: c.label, tipo: (c.tipo + (c.unidad ? ' · ' + c.unidad : '')).toUpperCase(),
        pos: i >= 0 ? String(i + 1) : '',
        borde: i >= 0 ? acc : linea, fondo: i >= 0 ? 'var(--accbg)' : 'transparent',
        color: i >= 0 ? acc : fg,
        onClick: () => this.toggleCol(c.key)
      });
    });

    // comparador
    const cmpPlanes = s.comparar.map(id => D.planes.find(p => p.id === id)).filter(Boolean);
    const cmpFilas = [];
    if (cmpPlanes.length >= 2) {
      D.meta.grupos.forEach(gr => {
        const campos = D.campos.filter(c => c.grupo === gr);
        campos.forEach(c => {
          const vals = cmpPlanes.map(p => this.fmt(p[c.key], c));
          const dif = vals.some(v => v !== vals[0]);
          if (s.soloDif && !dif) return;
          cmpFilas.push({
            label: c.label, marca: dif ? acc : 'transparent',
            fondo: dif && !s.soloDif ? 'var(--accbg)' : 'transparent',
            fondoLabel: dif ? 'var(--panel2)' : 'var(--panel)',
            celdas: vals.map(v => ({ txt: v, fuente: c.tipo === 'numero' ? mono : sans, color: dif ? fg : fg2 }))
          });
        });
      });
    }
    const cmpCols = cmpPlanes.map(p => ({ firma: p.firma, plan: p.plan, onQuitar: () => this.toggleComparar(p.id) }));

    // coste real
    const costes = vis.map(p => {
      const t = this.costeTarifa(p, s.meses), pr = this.costePromo(p, s.meses);
      const sinPrecio = !this.num(p.precio_tarifa) && !this.num(p.precio_promo);
      return {
        firma: p.firma, plan: p.plan,
        tipo: (p.tipo_precio ? String(p.tipo_precio) : 's/tipo').toUpperCase(),
        tarifa: sinPrecio ? 'sin precio' : this.miles(t) + ' $',
        promo: sinPrecio ? 'sin precio' : this.miles(pr) + ' $',
        ahorro: sinPrecio ? 'n/d' : (t - pr > 0 ? '−' + this.miles(t - pr) + ' $' : '—'),
        ahorroColor: t - pr > 0 ? 'var(--ok)' : fg3,
        onAbrir: () => this.setState({ ficha: p.id })
      };
    });

    // ficha
    const fp = s.ficha ? D.planes.find(p => p.id === s.ficha) : null;
    let ficha = null;
    if (fp) {
      ficha = {
        firma: fp.firma, plan: fp.plan, puestoTxt: this.puestoTxt(fp),
        precioTxt: this.precioTxt(fp),
        tarifaTxt: this.num(fp.precio_tarifa) ? this.miles(fp.precio_tarifa) + ' $' : '',
        hayDescuento: this.num(fp.precio_promo) && this.num(fp.precio_tarifa) && fp.precio_promo < fp.precio_tarifa,
        favColor: s.favs.indexOf(fp.id) >= 0 ? 'var(--warn)' : fg3,
        onFav: () => this.toggleFav(fp.id),
        badges: this.badges(fp),
        cmpTxt: s.comparar.indexOf(fp.id) >= 0 ? 'Quitar del comparador' : 'Anadir al comparador',
        cmpBorde: s.comparar.indexOf(fp.id) >= 0 ? acc : linea,
        cmpFondo: s.comparar.indexOf(fp.id) >= 0 ? 'var(--accbg)' : panel2,
        cmpColor: s.comparar.indexOf(fp.id) >= 0 ? acc : fg2,
        grupos: (D.meta.grupos || []).map(gr => {
          const campos = D.campos.filter(c => c.grupo === gr);
          const abierto = !!s.abiertos[gr];
          return {
            grupo: gr, n: campos.length + ' campos', abierto, chevron: abierto ? '▲' : '▼',
            onToggle: () => this.setState({ abiertos: Object.assign({}, s.abiertos, { [gr]: !abierto }) }),
            campos: campos.map(c => {
              const largo = c.tipo === 'texto' && String(fp[c.key] || '').length > 90;
              return {
                label: c.label, valor: this.fmt(fp[c.key], c),
                fuente: c.tipo === 'numero' || c.tipo === 'fecha' ? mono : sans,
                tam: largo ? '12px' : '13.5px',
                color: fp[c.key] === null || fp[c.key] === undefined || fp[c.key] === '' ? fg3 : (largo ? fg2 : fg)
              };
            })
          };
        })
      };
    }

    const tabs = [
      { k: 'lista', label: 'Lista', sub: vis.length + '/' + D.planes.length },
      { k: 'comparar', label: 'Comparar', sub: s.comparar.length + '/3' },
      { k: 'coste', label: 'Coste real', sub: s.meses + ' mes' + (s.meses === 1 ? '' : 'es') },
      { k: 'metodo', label: 'Metodo', sub: 'avisos' }
    ].map(t => ({
      label: t.label, sub: t.sub,
      marca: s.vista === t.k ? acc : 'transparent',
      color: s.vista === t.k ? fg : fg3,
      onClick: () => this.setState({ vista: t.k })
    }));

    const ordenCampo = this.campo(s.ordenKey);

    return {
      meta, metodo: meta.metodo || [],
      fechaConsultaTxt: this.fecha(meta.fecha_consulta),
      cabeceraSub: (meta.subtitulo || '') + ' · ' + D.planes.length + ' planes · ' + this.fecha(meta.fecha_consulta),
      q: s.q, hayQ: !!s.q, onQ: this.onQ, onQClear: this.onQClear,
      onTema: this.onTema, temaIcono: s.tema === 'claro' ? 'DÍA' : 'NOC',
      favBorde: s.soloFavs ? 'var(--warn)' : linea, favFondo: s.soloFavs ? 'var(--warnbg)' : panel2, favColor: s.soloFavs ? 'var(--warn)' : fg3,
      onFavsToggle: this.onFavsToggle, onLimpiar: this.onLimpiar, onCSV: this.csv,
      hayFiltros: nF > 0,
      filtrosSufijo: nF > 0 ? ' · ' + nF : '',
      filtrosBorde: nF > 0 ? acc : linea, filtrosFondo: nF > 0 ? 'var(--accbg)' : panel2, filtrosColor: nF > 0 ? acc : fg2,
      ordenEtiqueta: 'Orden: ' + ordenCampo.label + (s.ordenDir === 'asc' ? ' ↑' : ' ↓'),
      ordenResumen: s.vista === 'coste' ? 'coste con promo ↑' : ordenCampo.label.toLowerCase() + (s.ordenDir === 'asc' ? ' ↑' : ' ↓'),
      recuento: vis.length + ' de ' + D.planes.length + ' planes',
      onSheetFiltros: () => this.setState({ hoja: 'filtros' }),
      onSheetOrden: () => this.setState({ hoja: 'orden' }),
      onSheetColumnas: () => this.setState({ hoja: 'columnas' }),
      onCerrarHoja: () => this.setState({ hoja: null }),
      hojaAbierta: !!s.hoja, hojaEsFiltros: s.hoja === 'filtros', hojaEsOrden: s.hoja === 'orden', hojaEsColumnas: s.hoja === 'columnas',
      hojaTitulo: s.hoja === 'filtros' ? 'Filtros' : (s.hoja === 'orden' ? 'Ordenar por' : 'Metricas de la tarjeta'),
      esLista: s.vista === 'lista', esComparar: s.vista === 'comparar', esCoste: s.vista === 'coste', esMetodo: s.vista === 'metodo',
      esAncho: s.vista === 'lista' && s.ancho, esEstrecho: s.vista === 'lista' && !s.ancho,
      vacio: vis.length === 0,
      tarjetas, filas, tablaCabeceras, facetas, rangos, ordenGrupos: grupos, dirs, colGrupos, costes, tabs,
      cmpCols, cmpFilas, cmpVacio: cmpPlanes.length < 2, cmpListo: cmpPlanes.length >= 2,
      cmpMin: (128 + cmpPlanes.length * 180) + 'px',
      cmpResumen: cmpPlanes.length + ' de 3 planes seleccionados · ' + cmpFilas.length + ' filas',
      soloDif: s.soloDif, onSoloDif: () => this.setState({ soloDif: !s.soloDif }),
      difBorde: s.soloDif ? acc : linea, difFondo: s.soloDif ? 'var(--accbg)' : panel2, difColor: s.soloDif ? acc : fg2,
      meses: s.meses, onMeses: e => this.setState({ meses: +e.target.value }),
      ficha, fichaAbierta: !!ficha, onCerrarFicha: () => this.setState({ ficha: null })
    };
  }
}


var PROPS = {"temaInicial": "oscuro", "mesesInicial": 2, "avisoPromoDias": 7};
var app = new Component(document.getElementById('root'), PLANTILLA, PROPS);
window.__app = app;
app.montar();

</script>
</body>
</html>
